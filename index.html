<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .add-task {
            margin-bottom: 30px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .tasks {
            margin-top: 20px;
        }
        
        .task {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task.completed {
            opacity: 0.6;
            border-left-color: #28a745;
        }
        
        .task-content {
            flex: 1;
        }
        
        .task-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .task-desc {
            color: #666;
            font-size: 14px;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-delete {
            background: #dc3545;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .btn-complete {
            background: #28a745;
        }
        
        .btn-complete:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Task Manager</h1>
        
        <div class="add-task">
            <input type="text" id="taskTitle" placeholder="Task title...">
            <textarea id="taskDesc" placeholder="Description (optional)..." rows="3"></textarea>
            <button onclick="addTask()">Add Task</button>
        </div>
        
        <div class="tasks" id="taskList"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        // Load tasks when page loads
        window.onload = function() {
            loadTasks();
        };

        // Fetch and display all tasks
        function loadTasks() {
            fetch(`${API_URL}/tasks`)
                .then(response => response.json())
                .then(data => {
                    const taskList = document.getElementById('taskList');
                    taskList.innerHTML = '';
                    
                    data.tasks.forEach(task => {
                        const taskDiv = document.createElement('div');
                        taskDiv.className = `task ${task.completed ? 'completed' : ''}`;
                        
                        taskDiv.innerHTML = `
                            <div class="task-content">
                                <div class="task-title">${task.title}</div>
                                <div class="task-desc">${task.description || ''}</div>
                            </div>
                            <div class="task-actions">
                                <button class="btn-small btn-complete" onclick="toggleComplete(${task.id}, ${task.completed})">
                                    ${task.completed ? '✓' : '○'}
                                </button>
                                <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                            </div>
                        `;
                        
                        taskList.appendChild(taskDiv);
                    });
                });
        }

        // Add new task
        function addTask() {
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDesc').value;
            
            if (!title) {
                alert('Please enter a task title!');
                return;
            }
            
            fetch(`${API_URL}/tasks`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: title,
                    description: description
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDesc').value = '';
                loadTasks();
            });
        }

        // Toggle task completion
        function toggleComplete(id, currentStatus) {
            fetch(`${API_URL}/tasks/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    completed: currentStatus ? 0 : 1
                })
            })
            .then(() => loadTasks());
        }

        // Delete task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                fetch(`${API_URL}/tasks/${id}`, {
                    method: 'DELETE'
                })
                .then(() => loadTasks());
            }
        }
    </script>
</body>
</html>
